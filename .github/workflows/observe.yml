name: observe

on:
  schedule:
    # 毎月1日 03:00 UTC（JST 12:00）。ドメイン失効（2027-05-03）まで無人で回す
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 認証情報は不要。RDAP / DNS-over-HTTPS / HTTP応答はすべて公開情報
      - name: 観測
        run: python probe.py

      - name: 公開ページを再生成
        run: python build_site.py index.html

      - name: 変更をコミット
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "変化なし。コミットしない。"
            exit 0
          fi
          git config user.name "domain-lab bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "observe: $(date -u +%F) の観測を追記"
          git push
